name: RAG Evaluation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rag-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run deterministic RAG evaluation
        run: |
          uv run python -m packages.ai.evaluation.run_evaluation
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: artifacts/rag-evaluation-report.json
          if-no-files-found: ignore
