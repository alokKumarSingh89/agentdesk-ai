services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentdesk-qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant_data:
